name: Build Remote Terminal

on:
  workflow_dispatch:
  push:
    paths:
      - "remote_terminal_prototype_source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java for Android build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Extract source archive
        run: |
          unzip -q remote_terminal_prototype_source.zip -d source
          test -d source/remote_terminal_prototype/android
          test -f source/remote_terminal_prototype/j2me/src/RemoteTerminal.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble Android debug APK
        working-directory: source/remote_terminal_prototype/android
        run: gradle assembleDebug

      - name: Set up Java ME build tools
        run: |
          mkdir -p j2me-tools j2me-build/classes j2me-build/preverified
          curl -fsSL \
            https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.38.0/ecj-3.38.0.jar \
            -o j2me-tools/ecj.jar
          curl -fsSL \
            https://repo.maven.apache.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar \
            -o j2me-tools/cldcapi11.jar
          curl -fsSL \
            https://repo.maven.apache.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar \
            -o j2me-tools/midpapi20.jar
          curl -fsSL \
            https://repo.maven.apache.org/maven2/com/guardsquare/proguard-base/7.8.2/proguard-base-7.8.2.jar \
            -o j2me-tools/proguard-base.jar
          curl -fsSL \
            https://repo.maven.apache.org/maven2/com/guardsquare/proguard-core/9.1.5/proguard-core-9.1.5.jar \
            -o j2me-tools/proguard-core.jar
          curl -fsSL \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.20/kotlin-stdlib-2.0.20.jar \
            -o j2me-tools/kotlin-stdlib.jar

      - name: Compile MIDlet against CLDC 1.1 and MIDP 2.0 APIs
        run: |
          java -jar j2me-tools/ecj.jar \
            -source 1.3 -target cldc1.1 \
            -bootclasspath j2me-tools/cldcapi11.jar:j2me-tools/midpapi20.jar \
            -d j2me-build/classes \
            source/remote_terminal_prototype/j2me/src/RemoteTerminal.java

      - name: Preverify MIDlet classes
        run: |
          java -cp 'j2me-tools/*' proguard.ProGuard \
            -injars j2me-build/classes \
            -outjars j2me-build/preverified.jar \
            -libraryjars j2me-tools/cldcapi11.jar \
            -libraryjars j2me-tools/midpapi20.jar \
            -microedition \
            -dontwarn \
            -dontoptimize \
            -dontobfuscate \
            -keep public class RemoteTerminal extends javax.microedition.midlet.MIDlet {
              public <init>();
              public void startApp();
              public void pauseApp();
              public void destroyApp(boolean);
            }

      - name: Package MIDlet JAR and JAD
        run: |
          mkdir -p output
          cat > j2me-build/MANIFEST.MF <<'EOF'
          Manifest-Version: 1.0
          MIDlet-Name: Remote Terminal
          MIDlet-Version: 0.1
          MIDlet-Vendor: Remote Terminal
          MIDlet-1: Remote Terminal,,RemoteTerminal
          MicroEdition-Profile: MIDP-2.0
          MicroEdition-Configuration: CLDC-1.1
          EOF
          unzip -q j2me-build/preverified.jar -d j2me-build/preverified
          jar cfm output/RemoteTerminal.jar j2me-build/MANIFEST.MF -C j2me-build/preverified .
          SIZE=$(stat -c%s output/RemoteTerminal.jar)
          cat > output/RemoteTerminal.jad <<EOF
          MIDlet-Name: Remote Terminal
          MIDlet-Version: 0.1
          MIDlet-Vendor: Remote Terminal
          MIDlet-1: Remote Terminal,,RemoteTerminal
          MIDlet-Jar-URL: RemoteTerminal.jar
          MIDlet-Jar-Size: ${SIZE}
          MicroEdition-Profile: MIDP-2.0
          MicroEdition-Configuration: CLDC-1.1
          EOF

      - name: Collect Android APK
        run: |
          mkdir -p output/android
          cp source/remote_terminal_prototype/android/app/build/outputs/apk/debug/app-debug.apk \
             output/android/RemoteTerminal-debug.apk

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: remote-terminal-build
          path: output/
          if-no-files-found: error
          retention-days: 14
